name: Build WASendFix

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: brew install llvm

      - name: Debug LLVM bins
        run: ls /opt/homebrew/opt/llvm/bin/ | grep -i "ld\|lld"

      - name: Build WASendFix.dylib
        run: |
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          mkdir -p output
          bash build.sh

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WASendFix-dylib
          path: output/WASendFix.dylib
