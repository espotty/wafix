name: Build WASendFix

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (for ld64.lld)
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Build WASendFix.dylib
        run: |
          mkdir -p output
          bash build.sh

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WASendFix-dylib
          path: output/WASendFix.dylib
