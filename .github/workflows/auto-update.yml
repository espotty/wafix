name: Auto-update for new WhatsApp versions

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am
  workflow_dispatch:

permissions:
  contents: write


jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check latest WhatsApp version on App Store
        id: wa_version
        run: |
          LATEST=$(curl -s "https://itunes.apple.com/lookup?bundleId=net.whatsapp.WhatsApp&country=us" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['results'][0]['version'])")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest WhatsApp version on App Store: $LATEST"

          # NOTE: We intentionally do NOT update the spoofed version string.
          # The spoofed version is locked to "3.99.99.99" which matches the
          # protocol components (3, 99, 99, 99). Updating to the real App Store
          # version breaks WhatsApp (freeze) because it mismatches the components.
          # See HOW_WE_FIXED_IT.txt for the full explanation.
          echo "Spoofed version stays locked at 3.99.99.99 — no update needed."
          echo "changed=false" >> $GITHUB_OUTPUT

      - name: No update needed
        run: echo "Version spoof is intentionally locked to 3.99.99.99 (latest App Store: ${{ steps.wa_version.outputs.latest }})"
